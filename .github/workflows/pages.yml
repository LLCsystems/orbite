name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site et le zip itch.io
        run: |
          mkdir -p _site
          cp index.html _site/
          (cd _site && zip -q ../orbite-itchio.zip index.html)
      - uses: actions/upload-artifact@v4
        with:
          name: orbite-itchio
          path: orbite-itchio.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Le déploiement tourne dans un job séparé : GitHub a ainsi le temps
  # d'enregistrer l'artefact avant que deploy-pages le cherche.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
